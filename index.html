<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gridular</title>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Gridular</h1>
      <div class="breakpoint">
        <label class="field">
          <span class="field__label">Breakpoint</span>
          <input
            id="bp-width"
            class="input input--num"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            aria-label="Breakpoint width in pixels"
          />
          <span class="field__unit">px</span>
        </label>
        <div class="presets" id="presets" role="group" aria-label="Tailwind breakpoint presets"></div>
      </div>
      <button
        class="icon-btn theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to light mode"
        title="Switch to light mode"
      >
        ◐
      </button>
    </header>

    <div class="workspace">
      <aside class="guides" aria-label="Layout guides">
        <div class="guides__head">
          <span class="guides__title">Layout guide</span>
          <button class="icon-btn" id="guide-add" type="button" aria-label="Add layout guide">
            +
          </button>
        </div>
        <ul class="guides__list" id="guide-list"></ul>
      </aside>

      <main class="stage-wrap">
        <div class="stage" id="stage">
          <div class="stage__label" id="stage-label"></div>
          <div class="overlay" id="overlay"></div>
        </div>
      </main>

      <aside class="inspector" id="inspector" aria-label="Guide settings">
        <div class="inspector__head">
          <select class="inspector__type" id="inspector-type" aria-label="Guide type">
            <option value="grid">Grid</option>
            <option value="columns">Columns</option>
            <option value="rows">Rows</option>
          </select>
          <button class="icon-btn" id="inspector-close" type="button" aria-label="Close settings">
            &times;
          </button>
        </div>
        <div class="inspector__body" id="inspector-body"></div>
      </aside>
    </div>

    <section class="output" id="output" aria-label="Output">
      <div class="output__head">
        <span class="output__title">Output</span>
        <div class="output__tabs" id="output-tabs" role="tablist" aria-label="Output format">
          <button class="tab" type="button" role="tab" data-format="css" aria-selected="true">
            CSS
          </button>
          <button class="tab" type="button" role="tab" data-format="vars" aria-selected="false">
            Variables
          </button>
          <button class="tab" type="button" role="tab" data-format="json" aria-selected="false">
            JSON
          </button>
        </div>
        <button class="btn" id="output-copy" type="button">Copy</button>
      </div>
      <pre class="output__code" id="output-code"></pre>
    </section>

    <script src="grid.js"></script>
    <script src="breakpoints.js"></script>
    <script src="export.js"></script>
    <script src="app.js"></script>
  </body>
</html>
